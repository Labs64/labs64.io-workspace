# Reusable Maven publish to Labs64 Nexus. Nexus is the ONLY target of this workflow: every
# snapshot and every release lands there, as often as needed. Maven Central is a separate,
# manual step for releases worth promoting — see maven-promote-central.yml.
#   mode: snapshot -> deploy the current -SNAPSHOT (skips silently if the pom version
#                     is not a SNAPSHOT — never pushes a release to snapshots)
#   mode: release  -> GPG-signed deploy of <version> (-Drevision=<version> -P release)
#
# Releases are tag-driven: no pom in the ecosystem carries a real version (they declare
# `<version>${revision}</version>` with a 0.0.0-SNAPSHOT default), so a release is the
# tagged commit built with -Drevision=<tag>. This workflow therefore never commits,
# tags or pushes — the caller is a GitHub Release (or a manual run on the tag) and only
# needs `contents: read`.
#
# A release build fails if any parent or dependency is still a -SNAPSHOT (the
# requireReleaseDeps enforcer rule in io.labs64:labs64io-parent), and Nexus refuses to
# overwrite an existing release, so re-running a release is safe.
name: Reusable - Maven Publish

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      mode:
        required: true
        type: string
      version:
        description: "Release version X.Y.Z (mode: release) — normally the release tag"
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: "25"
    secrets:
      L64_PUB_CI_USERNAME:
        required: true
      L64_PUB_CI_PASSWORD:
        required: true
      GPG_KEY:
        required: false
      GPG_KEY_PASS:
        required: false
      RENOVATE_TRIGGER_TOKEN:
        description: "Starts the Renovate runner once the release is on Nexus (optional; without it the next scheduled run proposes the update)"
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
      RELEASE_VERSION: ${{ inputs.version }}
      L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
      L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Validate inputs
        working-directory: .
        run: |
          case "$MODE" in
            snapshot) ;;
            release)
              if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::invalid release version '$RELEASE_VERSION' (expected X.Y.Z)"; exit 1
              fi ;;
            *) echo "::error::unknown mode '$MODE' (snapshot|release)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - uses: Labs64/labs64.io-workspace/.github/actions/setup-maven@v1

      - uses: Labs64/labs64.io-workspace/.github/actions/maven-settings@v1
        with:
          nexus-username: ${{ secrets.L64_PUB_CI_USERNAME }}

      - name: Deploy snapshot
        if: inputs.mode == 'snapshot'
        run: |
          VERSION="$(mvn -q -ntp -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "Current version: $VERSION"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "Version $VERSION is not a SNAPSHOT — skipping snapshot deploy."
            exit 0
          fi
          mvn -U -B -ntp clean deploy

      - name: Import GPG key
        if: inputs.mode == 'release'
        uses: Labs64/labs64.io-workspace/.github/actions/gpg-import@v1
        with:
          gpg-key: ${{ secrets.GPG_KEY }}
          gpg-key-pass: ${{ secrets.GPG_KEY_PASS }}

      # A pom that still hardcodes its version would silently ignore -Drevision and
      # deploy something other than the tag; refuse before anything is published.
      - name: Verify the build takes its version from the tag
        if: inputs.mode == 'release'
        run: |
          EFFECTIVE="$(mvn -q -ntp -DforceStdout -Drevision="$RELEASE_VERSION" help:evaluate -Dexpression=project.version)"
          if [[ "$EFFECTIVE" != "$RELEASE_VERSION" ]]; then
            echo "::error::project.version resolves to '$EFFECTIVE', not '$RELEASE_VERSION' — the pom must declare <version>\${revision}</version>"
            exit 1
          fi

      - name: Release
        if: inputs.mode == 'release'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_KEY_PASS }}
        run: |
          mvn -U -B -ntp -Drevision="$RELEASE_VERSION" -P release \
            -Dgpg.pinentryMode=loopback clean deploy
          {
            echo "### Published ${RELEASE_VERSION} to Labs64 Nexus"
            echo
            echo "Built from \`${GITHUB_SHA}\` (\`${GITHUB_REF_NAME}\`) with \`-Drevision=${RELEASE_VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Renovate reads the release from Nexus, so ask it to run as soon as the deploy is done.
      # The step never fails the release.
      - name: Ask Renovate to propose the new release
        if: inputs.mode == 'release'
        uses: Labs64/labs64.io-workspace/.github/actions/renovate-trigger@v1
        with:
          token: ${{ secrets.RENOVATE_TRIGGER_TOKEN }}
          runner-repository: ${{ vars.RENOVATE_RUNNER_REPOSITORY }}
          reason: ${{ github.event.repository.name }} ${{ inputs.version }} released
