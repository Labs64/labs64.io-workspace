# Reusable Docker publish to DockerHub.
#   mode: edge    -> <image>:edge            (master pushes, after green CI)
#   mode: release -> <image>:<version> + :latest   (GitHub release)
# build-command runs before docker build (e.g. mvn package for jar-based images).
#
# Emits the pushed image digest as a workflow output. Neither Docker Hub nor GHCR can
# enforce tag immutability, so `<image>:<version>` may later resolve to different content
# than what this run validated — the digest is the only identity that cannot move. Callers
# forward `image-ref` into the Helm chart's `image.digest` (chart-libs >= 0.3.0) and into
# the release manifest.
name: Reusable - Docker Publish

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      mode:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      platforms:
        required: false
        type: string
        default: "linux/amd64,linux/arm64/v8"
      build-command:
        required: false
        type: string
        default: ""
      java-version:
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      L64_PUB_CI_USERNAME:
        required: false
      L64_PUB_CI_PASSWORD:
        required: false
    outputs:
      image:
        description: "Image repository that was pushed, e.g. labs64/checkout"
        value: ${{ jobs.publish.outputs.image }}
      tag:
        description: "Primary tag pushed — the version for mode=release, 'edge' for mode=edge"
        value: ${{ jobs.publish.outputs.tag }}
      digest:
        description: "Digest of the pushed image index, sha256:<64 hex>"
        value: ${{ jobs.publish.outputs.digest }}
      image-ref:
        description: "Immutable pull reference <image>@<digest> — deploy by this, not by tag"
        value: ${{ jobs.publish.outputs.image-ref }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tag: ${{ steps.identity.outputs.tag }}
      digest: ${{ steps.identity.outputs.digest }}
      image-ref: ${{ steps.identity.outputs.image-ref }}
    env:
      IMAGE: ${{ inputs.image }}
      MODE: ${{ inputs.mode }}
      VERSION: ${{ inputs.version }}
      BUILD_CMD: ${{ inputs.build-command }}
    steps:
      - name: Validate inputs
        run: |
          case "$MODE" in
            edge) ;;
            release)
              if [[ -z "$VERSION" ]]; then
                echo "mode=release requires a version input"; exit 1
              fi ;;
            *) echo "Unknown mode '$MODE' (edge|release)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - name: Set up JDK
        if: inputs.java-version != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Prepare Maven settings.xml
        if: inputs.build-command != ''
        env:
          L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
          L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
        run: |
          if [ -z "$L64_PUB_CI_USERNAME" ]; then
            echo "No credentials provided, skipping settings.xml generation."
            exit 0
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>labs64-nexus</id>
                <username>${env.L64_PUB_CI_USERNAME}</username>
                <password>${env.L64_PUB_CI_PASSWORD}</password>
              </server>
              <server>
                <id>labs64-nexus-snapshots</id>
                <username>${env.L64_PUB_CI_USERNAME}</username>
                <password>${env.L64_PUB_CI_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Pre-build
        if: inputs.build-command != ''
        env:
          L64_PUB_CI_USERNAME: ${{ secrets.L64_PUB_CI_USERNAME }}
          L64_PUB_CI_PASSWORD: ${{ secrets.L64_PUB_CI_PASSWORD }}
        run: $BUILD_CMD

      - name: Compute tags
        id: tags
        run: |
          if [[ "$MODE" == "edge" ]]; then
            PRIMARY="edge"
            printf 'tags<<EOF\n%s\nEOF\n' "$IMAGE:edge" >> "$GITHUB_OUTPUT"
          else
            PRIMARY="$VERSION"
            printf 'tags<<EOF\n%s\n%s\nEOF\n' "$IMAGE:$VERSION" "$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi
          # The primary tag is the one that identifies this release; :latest is a
          # navigation alias and must never be what a deployment resolves.
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ inputs.context }}
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

      # Resolve the immutable identity of what was just pushed. For a multi-platform
      # build this is the digest of the image index, so it is platform-independent and
      # is what a Deployment should reference.
      - name: Capture image digest
        id: identity
        env:
          PRIMARY_TAG: ${{ steps.tags.outputs.primary }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::build did not return a usable image digest (got '${BUILD_DIGEST}')"
            exit 1
          fi
          IMAGE_REF="${IMAGE}@${BUILD_DIGEST}"
          {
            echo "image=${IMAGE}"
            echo "tag=${PRIMARY_TAG}"
            echo "digest=${BUILD_DIGEST}"
            echo "image-ref=${IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Published \`${IMAGE}:${PRIMARY_TAG}\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Tag | \`${PRIMARY_TAG}\` |"
            echo "| Digest | \`${BUILD_DIGEST}\` |"
            echo "| Pull by | \`${IMAGE_REF}\` |"
            echo
            echo "Pin the deployment (chart-libs >= 0.3.0):"
            echo
            echo '```yaml'
            echo "image:"
            echo "  repository: ${IMAGE}"
            echo "  digest: ${BUILD_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Verify by digest rather than by tag: this asserts the labels on the exact
      # artifact this run produced, not on whatever the tag happens to resolve to.
      - name: Verify required OCI labels
        env:
          IMAGE_REF: ${{ steps.identity.outputs.image-ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          LABELS="$(docker inspect --format '{{json .Config.Labels}}' "$IMAGE_REF")"
          for key in org.opencontainers.image.licenses org.opencontainers.image.revision org.opencontainers.image.source io.labs64.edition; do
            echo "$LABELS" | jq -e --arg k "$key" 'has($k) and (.[$k] | length > 0)' >/dev/null \
              || { echo "::error::missing or empty OCI label '$key' on $IMAGE_REF"; exit 1; }
          done
