# Reusable SAST gate: Semgrep static analysis, distinct from the API-edge
# contract tests. Fails the build on ERROR-severity findings; WARNING/INFO are
# uploaded to code scanning but do not block. Every run writes a small
# `sast-manifest.json` naming the scanner and its exact version, so a release
# can state which scanners ran against that build (item 16).
name: Reusable - SAST

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      # Pinned, not "latest": the manifest's whole point is a reproducible
      # answer to "which scanner version ran against this build."
      semgrep-version:
        required: false
        type: string
        default: "1.171.0"
      # Semgrep Registry rulesets. p/secrets catches hardcoded credentials
      # (guardrail 2 ecosystem-wide); p/security-audit is the general-purpose
      # OWASP-style ruleset. Space-separated; each becomes its own --config.
      config:
        required: false
        type: string
        default: "p/security-audit p/secrets"
      manifest-name:
        required: false
        type: string
        default: "sast-manifest"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      scanner: semgrep
      version: ${{ steps.identity.outputs.version }}
      findings: ${{ steps.scan.outputs.findings }}
      blocking: ${{ steps.scan.outputs.blocking }}
    env:
      WD: ${{ inputs.working-directory }}
      CONFIG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install "semgrep==${{ inputs.semgrep-version }}"

      - name: Record scanner identity
        id: identity
        run: echo "version=$(semgrep --version)" >> "$GITHUB_OUTPUT"

      - name: Run Semgrep
        id: scan
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -o pipefail
          CONFIG_ARGS=""
          for c in $CONFIG; do CONFIG_ARGS="$CONFIG_ARGS --config $c"; done

          # SARIF for code scanning (every severity, informational).
          semgrep scan $CONFIG_ARGS --sarif --output semgrep.sarif || true

          # JSON to count findings by severity for the manifest and the gate.
          semgrep scan $CONFIG_ARGS --json --output semgrep.json
          FINDINGS=$(python3 -c "import json; print(len(json.load(open('semgrep.json'))['results']))")
          BLOCKING=$(python3 -c "import json; d=json.load(open('semgrep.json'))['results']; print(sum(1 for r in d if r['extra']['severity']=='ERROR'))")
          echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          echo "Findings: $FINDINGS total, $BLOCKING at ERROR severity"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.working-directory }}/semgrep.sarif

      - name: Write SAST manifest
        if: always()
        working-directory: ${{ inputs.working-directory }}
        env:
          SCANNER_VERSION: ${{ steps.identity.outputs.version }}
          FINDINGS_TOTAL: ${{ steps.scan.outputs.findings }}
          FINDINGS_ERROR: ${{ steps.scan.outputs.blocking }}
          MANIFEST_FILE: ${{ inputs.manifest-name }}.json
        run: |
          python3 -c "
          import json, os
          manifest = {
              'scanner': 'semgrep',
              'version': os.environ['SCANNER_VERSION'],
              'config': os.environ['CONFIG'].split(),
              'commit': os.environ['GITHUB_SHA'],
              'findings_total': int(os.environ['FINDINGS_TOTAL']),
              'findings_error_severity': int(os.environ['FINDINGS_ERROR']),
          }
          json.dump(manifest, open(os.environ['MANIFEST_FILE'], 'w'), indent=2)
          "
          cat "$MANIFEST_FILE"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.manifest-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.manifest-name }}.json
          retention-days: 90

      - name: Fail on ERROR-severity findings
        if: steps.scan.outputs.blocking != '0'
        env:
          FINDINGS_ERROR: ${{ steps.scan.outputs.blocking }}
        run: |
          echo "::error::$FINDINGS_ERROR ERROR-severity Semgrep finding(s). See the semgrep.json artifact or the code scanning tab."
          exit 1
